<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriela Díaz | Front-end developer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #202124;
    }

    .topbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #202124;
      border-bottom: 1px solid #3a3b3c;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .tab {
      padding: 10px 18px;
      border: 1px solid #3a3b3c;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      background: #2b2d31;
      color: #d7dce2;
      transition: 0.2s ease;
    }

    .tab:hover {
      background: #35373c;
    }

    .tab.active {
      background: #ffffff;
      color: #111111;
      border-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 70px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <button class="tab active" onclick="loadCV('Gabriela_Díaz_Frontend_CV.pdf', this)">
      Español
    </button>

    <button class="tab" onclick="loadCV('Gabriela_Díaz_Resume.pdf', this)">
      English
    </button>
  </div>

  <iframe id="cvFrame" src="Gabriela_Díaz_Frontend_CV.pdf"></iframe>

  <script>
    function loadCV(file, button) {
      document.getElementById("cvFrame").src = file;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      button.classList.add("active");
    }
  </script>

</body>
</html>
